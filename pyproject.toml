[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contribkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
contribkit = "contribkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["contribkit"]
